plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jwidori.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.jwidori.game"
        minSdk 21
        targetSdk 35
        versionCode 5
        versionName "0.3.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
